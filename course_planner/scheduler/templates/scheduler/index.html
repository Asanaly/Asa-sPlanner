<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JI Course Planner</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/schedule.css">
    <link rel="stylesheet" href="/static/css/modal.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JI Course Planner</h1>
            <p>Plan your academic schedule with interactive drag-and-drop functionality</p>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="filter-section">
                    <h3>Filter Courses</h3>
                    <input type="text" class="filter-input" id="searchInput" placeholder="Search courses...">
                    <div class="filter-checkbox">
                        <input type="checkbox" id="freshmanFilter" checked>
                        <label for="freshmanFilter">Freshman (I)</label>
                    </div>
                    <div class="filter-checkbox">
                        <input type="checkbox" id="sophomoreFilter" checked>
                        <label for="sophomoreFilter">Sophomore (II)</label>
                    </div>
                    <div class="filter-checkbox">
                        <input type="checkbox" id="juniorFilter" checked>
                        <label for="juniorFilter">Junior (III)</label>
                    </div>
                    <div class="filter-checkbox">
                        <input type="checkbox" id="seniorFilter" checked>
                        <label for="seniorFilter">Senior (IV)</label>
                    </div>
                    <div class="filter-checkbox">
                        <input type="checkbox" id="generalFilter" checked>
                        <label for="generalFilter">General</label>
                    </div>
                </div>
                
                <h3>Available Courses</h3>
                <div class="course-list" id="courseList">
                    <!-- Courses will be populated here -->
                </div>
                
                <div class="stats-section">
                    <h3>Current Schedule</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="totalCredits">0</div>
                            <div class="stat-label">Total Credits</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalCourses">0</div>
                            <div class="stat-label">Courses</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="avgDifficulty">0</div>
                            <div class="stat-label">Avg Difficulty</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalWorkload">0</div>
                            <div class="stat-label">Hours/Week</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="scheduler-area">
                <div class="semester-tabs" id="semesterTabs">
                    !-- Tabs will be populated dynamically by JavaScript -->
                </div>

                <div id="conflictWarnings"></div>
                
                <div class="schedule-grid" id="scheduleGrid">
                    <!-- Grid will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Course Detail Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalCourseTitle">Course Details</h2>
                <button class="close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalCourseContent">
                <!-- Content will be populated by JavaScript -->
            </div>
        </div>
    </div>
    
    <!-- JavaScript Files - CORRECT ORDER -->
    <script src="/static/js/config.js"></script>
    <script src="/static/js/utils/timeUtils.js"></script>
    <script src="/static/js/utils/colorUtils.js"></script>
    <script src="/static/js/state/appState.js"></script>
    <script src="/static/js/api/api.js"></script>
    <script src="/static/js/components/scheduleGrid.js"></script>    <!-- ← BEFORE main.js -->
    <script src="/static/js/components/courseList.js"></script>
    <script src="/static/js/components/scheduleManager.js"></script>
    <script src="/static/js/components/modal.js"></script>
    <script src="/static/js/main.js"></script>                       <!-- ← AFTER components -->
    <script src="/static/js/tests.js"></script>
</body>
</html>
